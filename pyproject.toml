[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-mystery-synth"
version = "0.1.0"
description = "Closed-world bioinformatics mystery task synthesis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.8",
    "pyhmmer>=0.12",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
openai = ["openai>=1.0", "socksio>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
bio-mystery-synth = "bio_mystery_synth.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
